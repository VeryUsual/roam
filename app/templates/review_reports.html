{% extends "base.html" %}

{% block content %}

<h1>Welcome, {{current_user.username}}!</h1>

<hr>
{% for report in reports %}
<p>Report ID {{report.id}}: @{{report.reporter.username}} reported <a href="/videos/{{report.video_id}}" target="_blank">this video</a> for "{{report.reason}}"</p>
<a href="#" onClick="MyWindow=window.open('/modpanel/punish','Punish','width=1100,height=800'); return false;">Issue Punishment</a><br><br><hr>
{% endfor %}

{% endblock %}
